[project]
name = "dupebot"
version = "0.1.0"
description = "Clusters likely duplicate files and explains them so a human can decide what to delete."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.7,<3",
    "botview",
    "finops",
]

[tool.uv.sources]
botview = { workspace = true }
finops = { workspace = true }

[project.scripts]
dupebot = "dupebot.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
