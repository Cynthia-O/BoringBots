# Workspace root. This holds no code of its own: it ties the bots together under
# one lockfile (uv.lock) and holds the dev tooling every bot shares.

[tool.uv.workspace]
members = ["bots/*", "packages/*"]  # bots, and code they share (packages/botview)

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"
# Lets import sorting recognise each bot's own package as first-party.
src = ["bots/*/src", "packages/*/src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib"
